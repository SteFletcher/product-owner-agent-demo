[project]
name = "po-agent"
version = "0.1.0"
description = "Product Owner agent benchmark: LLM baseline vs LLM + Jev hybrid, instrumented with OpenTelemetry"
requires-python = ">=3.12,<3.14"
dependencies = [
  "google-adk>=1.37,<2",
  "langgraph>=1.2,<2",
  "mcp>=1.10",
  "httpx>=0.28",
  "pydantic>=2.9",
  "pyyaml>=6",
  "opentelemetry-sdk>=1.40",
  "opentelemetry-exporter-otlp-proto-http>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
po-agent = "po_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["po_agent*"]

[tool.setuptools.package-data]
po_agent = ["graph/prompts/*.md", "knowledge/data/*.yaml", "evaluation/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
